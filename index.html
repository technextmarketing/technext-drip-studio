<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechNext Drip Studio</title>
<meta name="description" content="Build TechNext marketing drip images (Odoo, AI and industry posts) from brand layouts, write them with Claude, and export PNGs.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/logo-plane.png">
<link rel="stylesheet" href="drip.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="assets/brand/logo-horizontal.png" alt="TechNext"><h1>Drip Studio</h1></div>
    <div class="topacts" id="topacts"></div>
  </header>
  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="Categories and elements"></nav>
    <main class="main" id="main"></main>
    <aside class="insp" id="insp" aria-label="Edit drip" hidden></aside>
  </div>
</div>
<div class="dlg" id="dlg" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="content.js"></script>
<script src="industries-extra.js"></script>
<script src="drips.js"></script>
<script src="drip-render.js"></script>
<script src="odoo-ui.js"></script>
<script src="cards.js"></script>
<script src="props.js"></script>
<script src="simple.js"></script>
<script src="starters.js"></script>
<script src="ai.js"></script>
<script src="store.js"></script>
<script src="studio.js"></script>
</body>
</html>
